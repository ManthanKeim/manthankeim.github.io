<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="File transfer pipeline diagram">
  <rect width="640" height="400" fill="#0b0f17"/>
  <text x="40" y="48" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600">inbox - validate - deliver</text>
  <rect x="40" y="90" width="140" height="64" rx="12" fill="#1a2233" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="110" y="128" text-anchor="middle" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">Inbox</text>
  <rect x="250" y="90" width="140" height="64" rx="12" fill="#1a2233" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="320" y="128" text-anchor="middle" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">Validate</text>
  <rect x="460" y="90" width="140" height="64" rx="12" fill="#1a2233" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="530" y="128" text-anchor="middle" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">SFTP</text>
  <path d="M180 122h70" stroke="#38bdf8" stroke-width="2"/>
  <path d="M390 122h70" stroke="#38bdf8" stroke-width="2"/>
  <rect x="40" y="210" width="250" height="120" rx="12" fill="#1a2233"/>
  <text x="56" y="248" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">Terraform</text>
  <text x="56" y="278" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">local Docker + AWS S3</text>
  <text x="56" y="306" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">landing zones + IAM</text>
  <rect x="310" y="210" width="290" height="120" rx="12" fill="#1a2233"/>
  <text x="326" y="248" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">Audit</text>
  <text x="326" y="278" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">SHA-256 + quarantine</text>
  <text x="326" y="306" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">failed/ + error sidecar</text>
</svg>
