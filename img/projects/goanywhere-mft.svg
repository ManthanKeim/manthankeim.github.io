<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="GoAnywhere MFT partner drop through a project to a downstream sink">
  <rect width="640" height="400" fill="#0b0f17"/>
  <text x="40" y="48" fill="#3ee0c3" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600">GoAnywhere MFT - drop - move - audit</text>
  <rect x="40" y="80" width="160" height="100" rx="12" fill="#1a2233" stroke="#3ee0c3" stroke-opacity="0.45"/>
  <text x="120" y="118" text-anchor="middle" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">Partner</text>
  <text x="120" y="146" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13">SFTP user + folder</text>
  <rect x="230" y="80" width="180" height="100" rx="12" fill="#1a2233" stroke="#3ee0c3" stroke-opacity="0.45"/>
  <text x="320" y="118" text-anchor="middle" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">Project</text>
  <text x="320" y="146" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13">monitor / schedule</text>
  <rect x="440" y="80" width="160" height="100" rx="12" fill="#1a2233" stroke="#3ee0c3" stroke-opacity="0.45"/>
  <text x="520" y="118" text-anchor="middle" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">Sink</text>
  <text x="520" y="146" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13">SFTP / share / app</text>
  <path d="M200 130h30" stroke="#3ee0c3" stroke-width="2"/>
  <path d="M410 130h30" stroke="#3ee0c3" stroke-width="2"/>
  <rect x="40" y="220" width="270" height="120" rx="12" fill="#1a2233"/>
  <text x="56" y="258" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">Resources</text>
  <text x="56" y="288" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">users, keys, folders</text>
  <text x="56" y="316" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">who can land a file</text>
  <rect x="330" y="220" width="270" height="120" rx="12" fill="#1a2233"/>
  <text x="346" y="258" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">Audit</text>
  <text x="346" y="288" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">job log + retries</text>
  <text x="346" y="316" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">why last night failed</text>
</svg>
