<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="MCP host talking to a Python server over stdio or HTTP">
  <rect width="640" height="400" fill="#0b0f17"/>
  <text x="40" y="48" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600">MCP - tools over a protocol</text>
  <rect x="40" y="80" width="170" height="120" rx="12" fill="#1a2233" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="125" y="128" text-anchor="middle" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">Host</text>
  <text x="125" y="156" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13">Cursor / Claude</text>
  <rect x="235" y="100" width="170" height="80" rx="12" fill="#1a2233"/>
  <text x="320" y="134" text-anchor="middle" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="14">stdio or HTTP</text>
  <text x="320" y="158" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13">JSON-RPC</text>
  <rect x="430" y="80" width="170" height="120" rx="12" fill="#1a2233" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="515" y="128" text-anchor="middle" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">Python script</text>
  <text x="515" y="156" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13">MCPServer</text>
  <path d="M210 140h25" stroke="#38bdf8" stroke-width="2"/>
  <path d="M405 140h25" stroke="#38bdf8" stroke-width="2"/>
  <rect x="40" y="230" width="270" height="120" rx="12" fill="#1a2233"/>
  <text x="56" y="268" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">Local</text>
  <text x="56" y="298" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">mcp.run() / stdio</text>
  <text x="56" y="326" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">host launches the subprocess</text>
  <rect x="330" y="230" width="270" height="120" rx="12" fill="#1a2233"/>
  <text x="346" y="268" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">Hosted</text>
  <text x="346" y="298" fill="#e8edf7" font-family="Inter, system-ui, sans-serif" font-size="16">streamable-http</text>
  <text x="346" y="326" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14">listen on :8000/mcp</text>
</svg>
